# Freeze USART2 reception while the core is halted, so the DMA ring is stable.
# RE is USART2_CR1 bit 2 (0x40004400).
stm32h7x.cpu0 configure -event halted {
    mww 0x40004400 [expr {[mrw 0x40004400] & 0xFFFFFFFB}]
    echo "GSA200_DIAG: USART2 RX frozen on halt"
}
stm32h7x.cpu0 configure -event resumed {
    mww 0x40004400 [expr {[mrw 0x40004400] | 0x00000004}]
    echo "GSA200_DIAG: USART2 RX restored on resume"
}
